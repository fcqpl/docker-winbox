name: Build and publish Docker image

on:
  schedule:
    - cron: '0 3 * * MON'
  push:
    branches: [ main ]
    paths-ignore: [ '**.md', 'LICENSE', 'docker-compose.yml' ]
  pull_request:
  workflow_dispatch:
    inputs:
      winbox_version:
        description: WinBox version, empty = latest stable from mikrotik.com
        required: false

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: fcqpl/winbox
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve WinBox version
        id: winbox
        env:
          INPUT_VERSION: ${{ github.event.inputs.winbox_version }}
        run: |
          v="$INPUT_VERSION"
          if [ -z "$v" ]; then
            v=$(curl -fsSL -A 'Mozilla/5.0' https://mikrotik.com/download/winbox \
              | grep -oE 'routeros/winbox/[0-9]+\.[0-9.]+/WinBox_Linux\.zip' \
              | cut -d/ -f3 | sort -Vu | tail -1) || true
          fi
          if [ -z "$v" ]; then
            v=$(sed -n 's/^ARG WINBOX_VERSION=//p' Dockerfile)
            echo "::warning::mikrotik.com gave no version, using $v from Dockerfile"
          fi
          echo "WinBox $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Image tags
        id: tags
        run: |
          tags="$GHCR_IMAGE:latest,$GHCR_IMAGE:${{ steps.winbox.outputs.version }}"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            tags="$tags,$DOCKERHUB_IMAGE:latest,$DOCKERHUB_IMAGE:${{ steps.winbox.outputs.version }}"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Packages
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          build-args: WINBOX_VERSION=${{ steps.winbox.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
